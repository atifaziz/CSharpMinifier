name: CI

on:
  push:
    branches-ignore:
      - 'wip/**'
      - 'tmp/**'
    tags: [ 'v*' ]
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '.git*'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '.git*'

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: '8.0.x'

    - name: Display .NET info
      run: dotnet --info

    - name: Restore tools
      run: dotnet tool restore

    - name: Build
      run: dotnet build --configuration ${{ env.CONFIGURATION }}

    - name: Test
      run: dotnet test --no-build --configuration ${{ env.CONFIGURATION }}

    - name: Pack (Windows only)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        $commitTimestamp = git log -1 --format=%cI
        $versionSuffix = ([datetimeoffset]$commitTimestamp).ToUniversalTime().ToString('yyyyMMdd''t''HHmm')

        $releaseNotesFile = [System.IO.Path]::GetTempFileName()
        $tag = '${{ github.ref_name }}'
        $isTag = '${{ github.ref_type }}' -eq 'tag'

        # if the tag starts with "v", as in "v1.0.0", assume it's a release
        if ($isTag -and $tag -clike 'v*') {
          $url = '${{ github.server_url }}/${{ github.repository }}'
          Add-Content $releaseNotesFile -Encoding UTF8 "See: ${url}/releases/tag/$tag"
          Add-Content $releaseNotesFile -Encoding UTF8 ''
          # if tag ends in "-" followed by dot-separated identifiers...
          if ($tag -match '(?<=-)[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*$') {
            $versionSuffix = $matches[0] # ...then use as suffix for pre-release
          } else {
            $versionSuffix = $null       # ... else use no suffix for a release
          }
        }

        Add-Content $releaseNotesFile -Encoding UTF8 "Commit @ ${{ github.sha }}"
        $packArgs = @()
        if ($versionSuffix) {
          $packArgs += @('--version-suffix', $versionSuffix)
        }
        dotnet pack --no-build --configuration ${{ env.CONFIGURATION }} @packArgs "-p:PackageReleaseNotesFile=$releaseNotesFile"

    - name: Verify SourceLink (Windows only)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        Get-ChildItem -File -Filter CSharpMinifier.*.nupkg dist |
          Select-Object -ExpandProperty FullName |
          ForEach-Object { dotnet sourcelink test $_ }

        Get-ChildItem -File -Filter CSharpMinifierConsole.*.nupkg dist |
          Select-Object -First 1 -ExpandProperty FullName |
          ForEach-Object {
            Expand-Archive $_ tmp
            Get-ChildItem -Recurse -File -Filter CSharpMinifier*.dll tmp
          } |
          Select-Object -ExpandProperty FullName |
          ForEach-Object { dotnet sourcelink test $_ }

    - name: Validate Package (Windows only)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        Get-ChildItem -File -Filter *.nupkg dist |
          Select-Object -ExpandProperty FullName |
          ForEach-Object {
            Write-Host "Validating package: $_"
            dotnet meziantou.validate-nuget-package --excluded-rules 'IconMustBeSet,XmlDocumentationMustBePresent' $_
          }

    - name: Upload NuGet packages
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: NuGet
        path: dist/*.nupkg
