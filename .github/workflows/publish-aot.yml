name: Publish Native AOT

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc)
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          # Linux (musl / Alpine)
          - rid: linux-musl-x64
            os: ubuntu-latest
            container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
          # Windows
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          # macOS
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    steps:
      - name: Install Alpine build prerequisites
        if: matrix.container != ''
        run: apk add --no-cache bash clang build-base zlib-dev git

      - name: Install musl tools
        if: matrix.rid == 'linux-musl-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang musl-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >-
          dotnet publish src/CSharpMinifierConsole/CSharpMinifierConsole.csproj
          -c Release
          -r '${{ matrix.rid }}'
          -f net10.0
          --self-contained
          -o publish
          ${{ startsWith(matrix.rid, 'linux-musl') && !matrix.container && '-p:CppCompilerAndLinker=clang' || '' }}

      - name: Stage archive contents
        shell: bash
        run: |
          cp COPYING.txt publish/
          mkdir -p symbols
          mv publish/*.dbg symbols/ 2>/dev/null || true
          mv publish/*.pdb symbols/ 2>/dev/null || true
          if [ -d publish/*.dSYM ]; then
            mv publish/*.dSYM symbols/
          fi
          # Rename binary to csmin
          for f in publish/CSharpMinifierConsole publish/CSharpMinifierConsole.exe; do
            if [ -f "$f" ]; then
              mv "$f" "${f/CSharpMinifierConsole/csmin}"
            fi
          done
          # Create TAR for non-Windows to preserve permissions
          if [ "$RUNNER_OS" != "Windows" ]; then
            tar czf 'csmin-${{ matrix.rid }}.tar.gz' -C publish .
            if [ "$(ls -A symbols)" ]; then
              tar czf 'csmin-${{ matrix.rid }}-symbols.tar.gz' -C symbols .
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: csmin-${{ matrix.rid }}
          path: csmin-${{ matrix.rid }}.tar.gz
          archive: false
        if: runner.os != 'Windows'

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: csmin-${{ matrix.rid }}
          path: publish/*

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        if: runner.os != 'Windows' && hashFiles('symbols/*') != ''
        with:
          name: csmin-${{ matrix.rid }}-symbols
          path: csmin-${{ matrix.rid }}-symbols.tar.gz
          archive: false

      - name: Upload symbols (Windows)
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && hashFiles('symbols/*') != ''
        with:
          name: csmin-${{ matrix.rid }}-symbols
          path: symbols/*

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Create archives
        run: |
          mkdir -p archives
          for dir in artifacts/csmin-*; do
            name=$(basename "$dir")
            # Strip .tar.gz or .zip extension from directory name (archive: false artifacts)
            base="${name%.tar.gz}"
            base="${base%.zip}"
            if [[ "$name" == *win* ]]; then
              cp "$dir"/*.zip "archives/${base}-${{ steps.version.outputs.version }}.zip"
            else
              cp "$dir"/*.tar.gz "archives/${base}-${{ steps.version.outputs.version }}.tar.gz"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: archives/*
